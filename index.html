<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>RocketSQL WASM</title>
    <style>
        body {
            font-family: monospace;
            background: #111;
            color: #eee;
            padding: 1em;
        }

        textarea {
            width: 100%;
            height: 80px;
            background: #222;
            color: #0f0;
            border: none;
            padding: 10px;
        }

        button {
            margin-top: 8px;
        }

        pre {
            background: #000;
            padding: 10px;
        }
    </style>
</head>

<body>
    <h2>RocketSQL 🚀</h2>
    <textarea id="input" placeholder="Enter SQL here..."></textarea><br>
    <button id="run">Run SQL</button>
    <button id="dump">Dump Page</button>
    <pre id="output"></pre>

    <script src="wasm_exec.js"></script>
    <script>
        const go = new Go();
        WebAssembly.instantiateStreaming(fetch("rocketsql.wasm"), go.importObject)
            .then(result => go.run(result.instance));

        document.getElementById("run").onclick = () => {
            const sql = document.getElementById("input").value;
            const out = executeSQL(sql);
            document.getElementById("output").textContent = out;
            console.log(getAllPages());
        };

        document.getElementById("dump").onclick = () => {
            const pg_num = document.getElementById("input").value;
            const pg = getPage(pg_num);
            console.log(pg);
        };
    </script>
</body>

</html>
